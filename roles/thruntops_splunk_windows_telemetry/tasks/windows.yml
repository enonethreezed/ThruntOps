---
- name: (splunk_windows_telemetry/win) Enable Defender and DNS Client event channels
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $channels = @(
        'Microsoft-Windows-Windows Defender/Operational',
        'Microsoft-Windows-DNS-Client/Operational'
      )
      foreach ($channel in $channels) {
        $log = Get-WinEvent -ListLog $channel -ErrorAction Stop
        if (-not $log.IsEnabled) {
          & wevtutil.exe sl $channel /e:true
          if ($LASTEXITCODE -ne 0) { throw "Failed to enable $channel" }
          $Ansible.Changed = $true
        }
        if ($log.MaximumSizeInBytes -lt 104857600) {
          & wevtutil.exe sl $channel /ms:104857600
          if ($LASTEXITCODE -ne 0) { throw "Failed to resize $channel" }
          $Ansible.Changed = $true
        }
      }

- name: (splunk_windows_telemetry/win) Enable DNS Server Analytical channel on DC
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $channel = 'Microsoft-Windows-DNS-Server/Analytical'
      $log = Get-WinEvent -ListLog $channel -ErrorAction SilentlyContinue
      if ($null -eq $log) {
        $Ansible.Result = 'DNS Server Analytical channel is unavailable; DNS Server role may not be installed'
        return
      }
      $changed = $false
      if (-not $log.IsEnabled) {
        & wevtutil.exe sl $channel /e:true
        if ($LASTEXITCODE -ne 0) { throw "Failed to enable $channel" }
        $changed = $true
      }
      if ($log.MaximumSizeInBytes -lt 104857600) {
        & wevtutil.exe sl $channel /ms:104857600
        if ($LASTEXITCODE -ne 0) { throw "Failed to resize $channel" }
        $changed = $true
      }
      $Ansible.Changed = $changed
  when: thruntops_splunk_windows_telemetry_is_domain_controller | bool

- name: (splunk_windows_telemetry/win) Create PowerShell transcript directory
  ansible.windows.win_file:
    path: "{{ thruntops_splunk_windows_telemetry_transcript_path }}"
    state: directory

- name: (splunk_windows_telemetry/win) Enable PowerShell transcription
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription
    name: EnableTranscripting
    data: 1
    type: dword
    state: present

- name: (splunk_windows_telemetry/win) Set PowerShell transcript output directory
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription
    name: OutputDirectory
    data: "{{ thruntops_splunk_windows_telemetry_transcript_path }}"
    type: string
    state: present

- name: (splunk_windows_telemetry/win) Add invocation headers to PowerShell transcripts
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription
    name: EnableInvocationHeader
    data: 1
    type: dword
    state: present

- name: (splunk_windows_telemetry/win) Configure Windows Firewall text logging
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $desiredPath = '{{ thruntops_splunk_windows_telemetry_firewall_log }}'
      $changed = $false
      foreach ($profile in Get-NetFirewallProfile) {
        if ($profile.LogFileName -ne $desiredPath -or
            $profile.LogMaxSizeKilobytes -lt 16384 -or
            -not $profile.LogAllowed -or -not $profile.LogBlocked) {
          Set-NetFirewallProfile -Profile $profile.Name `
            -LogFileName $desiredPath -LogMaxSizeKilobytes 16384 `
            -LogAllowed True -LogBlocked True
          $changed = $true
        }
      }
      $Ansible.Changed = $changed
