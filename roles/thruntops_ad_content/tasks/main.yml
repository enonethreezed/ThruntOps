---
- name: Validate AD identity seed contract
  ansible.builtin.assert:
    that:
      - thruntops_ad_content_users | length > 0
      - >-
        required_identity in
        (thruntops_ad_content_users | map(attribute='name') | list)
    fail_msg: "Missing required AD scenario identity: {{ required_identity }}"
  loop:
    - asrep.user
    - svc.web
    - helpdesk.user
  loop_control:
    loop_var: required_identity

- name: Validate AD identity attributes
  ansible.builtin.assert:
    that:
      - item.name is string
      - item.name | length > 0
      - item.password is string
      - item.password | length > 0
    fail_msg: Every seeded AD identity requires a non-empty name and password.
  loop: "{{ thruntops_ad_content_users }}"
  no_log: true

- name: Create AD groups
  microsoft.ad.group:
    name: "{{ item.name }}"
    scope: global
    state: present
  loop: "{{ thruntops_ad_content_groups }}"

- name: Create domain users
  microsoft.ad.user:
    name: "{{ item.name }}"
    firstname: "{{ item.firstname | default(item.name) }}"
    surname: "{{ item.surname | default('') }}"
    display_name: "{{ item.display_name | default(item.name) }}"
    password: "{{ item.password }}"
    description: "{{ item.description | default('') }}"
    state: present
    password_never_expires: true
    groups:
      add: "{{ item.groups | default(['Domain Users']) }}"
  loop: "{{ thruntops_ad_content_users }}"
  no_log: true

- name: Add domain users to Remote Desktop Users group
  ansible.windows.win_group_membership:
    name: Remote Desktop Users
    members: "{{ thruntops_ad_content_rdp_members }}"
    state: present
  when: thruntops_ad_content_rdp_members | length > 0
