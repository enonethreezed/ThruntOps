---
- name: (wazuh_agent) Wait for Wazuh manager registration service (authd) to be ready
  ansible.builtin.wait_for:
    host: "{{ ludus_wazuh_agent_manager_ip }}"
    port: "{{ ludus_wazuh_agent_manager_registration_port }}"
    timeout: "{{ ludus_wazuh_agent_manager_wait_timeout }}"
  delegate_to: localhost
  run_once: true

- name: (wazuh_agent) Install on Windows
  ansible.builtin.include_tasks: windows.yml
  when: ansible_os_family == "Windows"

- name: (wazuh_agent) Install on Linux
  ansible.builtin.include_tasks: linux.yml
  when: ansible_os_family == "Debian"
