---
- name: (wazuh_agent/win) Check if agent is already installed
  ansible.windows.win_service:
    name: WazuhSvc
  register: wazuh_svc
  ignore_errors: true

- name: (wazuh_agent/win) Download Wazuh agent MSI
  ansible.windows.win_get_url:
    url: "{{ wazuh_agent_msi_url }}"
    dest: 'C:\Windows\Temp\wazuh-agent.msi'
  when: wazuh_svc.state is not defined or wazuh_svc.state == "absent"

- name: (wazuh_agent/win) Install Wazuh agent
  ansible.windows.win_package:
    path: 'C:\Windows\Temp\wazuh-agent.msi'
    arguments:
      - "WAZUH_MANAGER={{ wazuh_manager_ip }}"
      - "WAZUH_REGISTRATION_SERVER={{ wazuh_manager_ip }}"
    state: present
  when: wazuh_svc.state is not defined or wazuh_svc.state == "absent"

- name: (wazuh_agent/win) Configure manager IP in ossec.conf
  ansible.windows.win_shell: |
    $conf = 'C:\Program Files (x86)\ossec-agent\ossec.conf'
    $content = Get-Content $conf -Raw
    $updated = $content -replace '<address>.*?</address>', '<address>{{ wazuh_manager_ip }}</address>'
    if ($content -ne $updated) { Set-Content $conf $updated; Write-Output 'changed' }
  register: wazuh_agent_config
  changed_when: "'changed' in wazuh_agent_config.stdout"

- name: (wazuh_agent/win) Collect Sysmon event channel
  ansible.windows.win_shell: |
    $conf = 'C:\Program Files (x86)\ossec-agent\ossec.conf'
    $content = Get-Content $conf -Raw
    if ($content -notmatch '<location>Microsoft-Windows-Sysmon/Operational</location>') {
      $sysmon = "  <localfile>`r`n    <location>Microsoft-Windows-Sysmon/Operational</location>`r`n    <log_format>eventchannel</log_format>`r`n  </localfile>"
      $updated = $content -replace '</ossec_config>', "$sysmon`r`n</ossec_config>"
      Set-Content $conf $updated
      Write-Output 'changed'
    }
  register: wazuh_sysmon_config
  changed_when: "'changed' in wazuh_sysmon_config.stdout"

- name: (wazuh_agent/win) Stop WazuhSvc after config change
  ansible.windows.win_service:
    name: WazuhSvc
    state: stopped
  register: wazuh_svc_stop
  until: wazuh_svc_stop is succeeded
  retries: 5
  delay: 5
  when: wazuh_agent_config is changed or wazuh_sysmon_config is changed

- name: (wazuh_agent/win) Start WazuhSvc after config change
  ansible.windows.win_service:
    name: WazuhSvc
    state: started
  when: wazuh_agent_config is changed or wazuh_sysmon_config is changed

- name: (wazuh_agent/win) Ensure WazuhSvc is started and enabled
  ansible.windows.win_service:
    name: WazuhSvc
    state: started
    start_mode: auto
