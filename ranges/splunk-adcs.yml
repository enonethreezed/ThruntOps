defaults:
  ad_domain_admin: domainadmin
  ad_domain_admin_password: password
  ad_domain_user: domainuser
  ad_domain_user_password: password
  ad_domain_safe_mode_password: password
  ad_domain_functional_level: Win2012R2
  ad_forest_functional_level: Win2012R2
  snapshot_with_RAM: true
  stale_hours: 0
  timezone: "Europe/Madrid"
  enable_dynamic_wallpaper: true

ludus:
  - vm_name: "{{ range_id }}-splunk"
    hostname: "{{ range_id }}-splunk"
    template: ubuntu-24.04-x64-server-template
    vlan: 20
    ip_last_octet: 1
    ram_gb: 6
    cpus: 4
    linux: true
    testing:
      snapshot: false
      block_internet: false
    roles:
      - ludus_splunk
      - ludus_ops
    role_vars:
      ludus_splunk_admin_password: "thisisapassword"
      ludus_splunk_version: "10.2.1"
      ludus_splunk_deb_url: "https://download.splunk.com/products/splunk/releases/10.2.1/linux/splunk-10.2.1-c892b66d163d-linux-amd64.deb"
      ludus_splunk_indexes:
        - windows
        - sysmon
        - linux
      ludus_ops_deploy_monkey: false
      ludus_ops_manage_localuser_ssh: false

  - vm_name: "{{ range_id }}-ad-dc-win2022-server-x64"
    hostname: "{{ range_id }}-DC01-2022"
    template: win2022-server-x64-template
    vlan: 20
    ip_last_octet: 11
    ram_gb: 6
    cpus: 4
    windows:
      sysprep: false
    domain:
      fqdn: thruntops.domain
      role: primary-dc
    roles:
      - ludus_sysmon_windows
      - ludus_splunk_uf
    role_vars:
      ludus_splunk_server_ip: "10.1.20.1"
      ludus_splunk_uf_package_windows: "https://download.splunk.com/products/universalforwarder/releases/10.2.1/windows/splunkforwarder-10.2.1-c892b66d163d-windows-x64.msi"

  - vm_name: "{{ range_id }}-adcs"
    hostname: "{{ range_id }}-ADCS"
    template: win2022-server-x64-template
    vlan: 20
    ip_last_octet: 13
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    domain:
      fqdn: thruntops.domain
      role: member
    roles:
      - ludus_sysmon_windows
      - ludus_splunk_uf
      - badsectorlabs.ludus_adcs
    role_vars:
      ludus_splunk_server_ip: "10.1.20.1"
      ludus_splunk_uf_package_windows: "https://download.splunk.com/products/universalforwarder/releases/10.2.1/windows/splunkforwarder-10.2.1-c892b66d163d-windows-x64.msi"
      ludus_adcs_domain_username: "thruntops\\domainadmin"
      ludus_adcs_domain_password: password

  - vm_name: "{{ range_id }}-ad-win11-22h2-enterprise-x64-1"
    hostname: "{{ range_id }}-WIN11-22H2-1"
    template: win11-22h2-x64-enterprise-template
    vlan: 20
    ip_last_octet: 21
    ram_gb: 4
    cpus: 4
    windows:
      sysprep: false
    domain:
      fqdn: thruntops.domain
      role: member
    roles:
      - ludus_sysmon_windows
      - ludus_splunk_uf
    role_vars:
      ludus_splunk_server_ip: "10.1.20.1"
      ludus_splunk_uf_package_windows: "https://download.splunk.com/products/universalforwarder/releases/10.2.1/windows/splunkforwarder-10.2.1-c892b66d163d-windows-x64.msi"
