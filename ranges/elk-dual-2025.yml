defaults:
  ad_domain_admin: domainadmin
  ad_domain_admin_password: password
  ad_domain_user: domainuser
  ad_domain_user_password: password
  ad_domain_safe_mode_password: password
  ad_domain_functional_level: Win2012R2
  ad_forest_functional_level: Win2012R2
  snapshot_with_RAM: true
  stale_hours: 0
  timezone: "Europe/Madrid"
  enable_dynamic_wallpaper: false

ludus:
  - vm_name: "{{ range_id }}-elastic"
    hostname: "{{ range_id }}-elastic"
    template: debian-12-x64-server-template
    vlan: 20
    ip_last_octet: 1
    ram_gb: 8
    cpus: 4
    linux: true
    testing:
      snapshot: false
      block_internet: true
    roles:
      - badsectorlabs.ludus_elastic_container
      - ludus_ops
    role_vars:
      ludus_elastic_password: "thisisapassword"
      ludus_elastic_stack_version: "9.4.0"
      ludus_ops_manage_localuser_ssh: false

  - vm_name: "{{ range_id }}-ad-dc-win2025-server-x64"
    hostname: "{{ range_id }}-DC01-2025"
    template: win2025-server-x64-tpm-template
    vlan: 20
    ip_last_octet: 11
    ram_gb: 6
    cpus: 4
    windows:
      sysprep: false
    domain:
      fqdn: thruntops.domain
      role: primary-dc
    roles:
      - badsectorlabs.ludus_elastic_agent
    role_vars:
      ludus_elastic_agent_version: "9.4.0"

  - vm_name: "{{ range_id }}-ad-dc-win2025-secondary"
    hostname: "{{ range_id }}-DC01-SEC"
    template: win2025-server-x64-tpm-template
    vlan: 20
    ip_last_octet: 12
    ram_gb: 4
    cpus: 4
    windows:
      sysprep: false
    domain:
      fqdn: secondary.thruntops.domain
      role: primary-dc
    roles:
      - badsectorlabs.ludus_elastic_agent
    role_vars:
      ludus_elastic_agent_version: "9.4.0"

  - vm_name: "{{ range_id }}-ad-win11-22h2-enterprise-x64-1"
    hostname: "{{ range_id }}-WIN11-22H2-1"
    template: win11-22h2-x64-enterprise-template
    vlan: 20
    ip_last_octet: 21
    ram_gb: 4
    cpus: 4
    windows:
      sysprep: false
    domain:
      fqdn: thruntops.domain
      role: member
    roles:
      - badsectorlabs.ludus_elastic_agent
    role_vars:
      ludus_elastic_agent_version: "9.4.0"

  - vm_name: "{{ range_id }}-ad-win11-22h2-enterprise-x64-2"
    hostname: "{{ range_id }}-WIN11-22H2-2"
    template: win11-22h2-x64-enterprise-template
    vlan: 20
    ip_last_octet: 22
    ram_gb: 4
    cpus: 4
    windows:
      sysprep: false
    domain:
      fqdn: secondary.thruntops.domain
      role: member
    roles:
      - badsectorlabs.ludus_elastic_agent
    role_vars:
      ludus_elastic_agent_version: "9.4.0"
