---
title: ThruntOps
tagline: Tactics, Techniques & Paranoia.
description: A Ludus-based purple-team lab for TTP detection testing.
url: https://enonethreezed.github.io
baseurl: /ThruntOps
lang: en
timezone: Europe/Madrid
theme: jekyll-theme-chirpy
theme_mode: dark
avatar: /logo.png

github:
  username: enonethreezed

social:
  name: ThruntOps
  links:
    - https://github.com/enonethreezed/ThruntOps

plugins:
  - jekyll-archives
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
